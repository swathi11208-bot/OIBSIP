<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureTech - Build Your Future</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #222;
        }

        /* Navigation */
        header {
            background: #111827;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: #dff3ff;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
        }

        /* Sections */
        section {
            padding: 60px 8%;
            text-align: center;
        }

        section h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: #f3f4f6;
            padding: 30px 20px;
            border-radius: 10px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .about {
            background: #eef6ff;
        }

        /* Footer */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer a {
            color: white;
            margin: 0 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 17px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            section {
                padding: 45px 20px;
            }
        }
    </style>
</head>

    <!-- Navigation -->
    <header>
        <h2>FutureTech</h2>

        <nav
